name: Bundle Size Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle-size:
    name: Bundle Size Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Check bundle size
        run: |
          # Check total size of build output
          BUILD_DIR="frontend/dist"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "FAIL: Build directory not found"
            exit 1
          fi
          
          # Calculate total size of JS/CSS/HTML assets in KB (excluding .map source maps emitted for monitoring)
          TOTAL_SIZE_KB=$(find "./$BUILD_DIR" -type f ! -name "*.map" -exec du -k {} + | awk '{s+=$1} END {print s}')
          TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE_KB / 1024" | bc)
          
          echo "Production asset bundle size (excluding .map files): ${TOTAL_SIZE_MB}MB"
          
          # Fail if production bundle exceeds 5MB limit
          MAX_SIZE_KB=5120
          if [ "$TOTAL_SIZE_KB" -gt "$MAX_SIZE_KB" ]; then
            echo "FAIL: Bundle size ${TOTAL_SIZE_MB}MB exceeds 5MB limit"
            exit 1
          fi
          
          echo "PASS: Bundle size within limits"

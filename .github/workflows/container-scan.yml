# Container image vulnerability scanning with Trivy
# P0-14 FIX: now BLOCKING — CRITICAL/HIGH findings fail the pipeline.

name: Container Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/container-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    timeout-minutes: 30
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker image
        id: docker-build
        run: |
          docker build -t bazspark:scan . || {
            echo "::warning::Docker build failed - running filesystem scan instead"
            echo "build_failed=true" >> "$GITHUB_OUTPUT"
          }

      - name: Run Trivy on Docker image
        if: steps.docker-build.outputs.build_failed != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: 'bazspark:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
        # P0-14 FIX: removed `continue-on-error` and switched exit-code to '1'
        # — CRITICAL/HIGH findings must fail the pipeline.

      - name: Run Trivy filesystem scan (fallback)
        if: steps.docker-build.outputs.build_failed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
        # P0-14 FIX: removed `continue-on-error` and switched exit-code to '1'.

      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' > trivy-results.sarif
            echo "Created empty SARIF (no scan results)"
          fi

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        # P0-14 FIX: removed `continue-on-error: true`.

      - name: Scan summary
        if: always()
        run: echo "Container security scan complete. Check Security tab for vulnerability details."
name: Auto-merge Dependabot PRs

# Safety-critical policy: Auto-merge is permitted ONLY for dev dependencies
# and non-critical patch/minor updates after all CI status checks pass.
# Production & safety-critical packages require manual review.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

# Serialize runs per PR: dependabot fires multiple pull_request_target events
# (opened + labeled + synchronize), which previously raced and caused
# "enablePullRequestAutoMerge" failures when concurrent runs tried to enable
# auto-merge on the same PR at the same time.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  auto-merge:
    timeout-minutes: 30
    name: Dependabot Auto-Merge Evaluator
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0 (Node 24 runtime)
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check if package is safety-critical or production
        id: check-safety
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const depNames = '${{ steps.metadata.outputs.dependency-names }}'.split(',').map(s => s.trim().toLowerCase());
            const depType = '${{ steps.metadata.outputs.dependency-type }}'; // 'direct:production', 'direct:development', etc.
            const updateType = '${{ steps.metadata.outputs.update-type }}'; // 'version-update:semver-major', etc.

            const CRITICAL_PACKAGES = [
              'fastapi', 'starlette', 'uvicorn', 'gunicorn',
              'cryptography', 'pyjwt', 'passlib', 'bcrypt',
              'pydantic', 'pydantic-settings', 'sqlalchemy', 'alembic',
              'aiohttp', 'requests', 'httpx', 'websockets', 'asyncpg',
              'numpy', 'scipy', 'shapely',
              'python-multipart', 'pillow', 'lxml',
              'redis', 'celery', 'kombu',
              'langgraph', 'langgraph-checkpoint-sqlite',
              'react', 'react-dom', 'react-router-dom', 'vite',
              'typescript', '@vitejs/plugin-react',
            ];

            let isCritical = false;
            for (const name of depNames) {
              if (CRITICAL_PACKAGES.some(c => name === c || name.endsWith('/' + c) || name.replace('/', '-') === c)) {
                isCritical = true;
                break;
              }
            }

            const isDev = depType === 'direct:development' || depType === 'indirect';
            const isMajor = updateType === 'version-update:semver-major';

            // Safe to auto-merge ONLY if:
            // 1. Not a safety-critical package
            // 2. Is a dev dependency OR non-major update
            const safe = (!isCritical) && (isDev || !isMajor);

            console.log(`Dependencies: ${depNames.join(', ')}`);
            console.log(`Dependency Type: ${depType}`);
            console.log(`Update Type: ${updateType}`);
            console.log(`Is Critical Package: ${isCritical}`);
            console.log(`Safe to Auto-merge: ${safe}`);

            core.setOutput('safe', safe ? 'true' : 'false');
            core.setOutput('is_critical', isCritical ? 'true' : 'false');

      - name: Auto-approve PR
        if: steps.check-safety.outputs.safe == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for required checks
        if: steps.check-safety.outputs.safe == 'true'
        id: wait-for-checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        timeout-minutes: 15
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.head || !pr.head.sha) {
              console.log('No PR head SHA found in payload - skipping auto-merge evaluator');
              core.setOutput('ready', 'false');
              return;
            }

            const ref = pr.head.sha;
            const { owner, repo } = context.repo;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              try {
                const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref });
                const { data: checkRuns } = await github.rest.checks.listForRef({ owner, repo, ref });

                const statusList = Array.isArray(statuses) ? statuses : [];
                const checkList = Array.isArray(checkRuns?.check_runs) ? checkRuns.check_runs : [];

                const pendingStatuses = statusList.filter(s => s.state === 'pending');
                const pendingChecks = checkList.filter(c =>
                  c.status !== 'completed' && c.name !== 'Dependabot Auto-Merge Evaluator'
                );

                console.log(`pending statuses=${pendingStatuses.length}, pending checks=${pendingChecks.length}`);

                if (pendingStatuses.length === 0 && pendingChecks.length === 0) {
                  const allOk =
                    statusList.every(s => s.state === 'success') &&
                    checkList.every(c =>
                      c.status !== 'completed' ||
                      c.name === 'Dependabot Auto-Merge Evaluator' ||
                      c.conclusion === 'success' || c.conclusion === 'skipped' || c.conclusion === 'neutral'
                    );
                  core.setOutput('ready', allOk ? 'true' : 'false');
                  console.log(allOk ? 'All required checks passed' : 'Some checks failed - skip auto-merge');
                  return;
                }
              } catch (err) {
                console.error(`Octokit API error while polling checks: ${err?.message || err}`);
              }

              await new Promise(r => setTimeout(r, 15000));
            }

            console.log('Timeout waiting for checks - skip auto-merge');
            core.setOutput('ready', 'false');

      - name: Enable auto-merge
        if: steps.check-safety.outputs.safe == 'true' && steps.wait-for-checks.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --auto --squash "$PR_URL"; then
              echo "Auto-merge enabled for $PR_URL"
              exit 0
            fi
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              echo "PR already merged - nothing to do."
              exit 0
            fi
            echo "Enable auto-merge attempt $attempt failed (state=$state), retrying..."
            sleep 15
          done
          echo "::error::Could not enable auto-merge after 3 attempts."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip auto-merge (critical/production package)
        if: steps.check-safety.outputs.safe != 'true'
        run: |
          echo "::notice::Auto-merge skipped for safety-critical or major production package."
          echo "Dependencies: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Requires manual engineering review."
name: Full Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - github
          - huggingface
          - render
          - langwatch

env:
  # GitHub Container Registry
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  
  # Repository info
  REPO_OWNER: ahmdelbaz28-ux
  REPO_NAME: BAZspark
  ETAP_REPO: ahmdelbaz28-ux/ETAP-AI-WORK-.git
  
  # Hugging Face
  HF_SPACE_ID: ahmdelbaz28/BAZSPARK
  
  # Render
  RENDER_SERVICE_ID: fireai
  
  # Version
  VERSION: ${{ github.sha }}

concurrency:
  group: full-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read
jobs:
  # ============================================================================
  # JOB 1: Test & Validate
  # ============================================================================
  test:
    timeout-minutes: 30
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --only-binary :all:  # NOSONAR: githubactions:S8544 — pip self-upgrade, no external dep resolver
          pip install --only-binary :all: -r requirements.txt  # NOSONAR: githubactions:S8544 — requirements.txt pins versions
          pip install --only-binary :all: -e .  # NOSONAR: githubactions:S8544 — editable install of local repo
          pip install --only-binary :all: ruff==0.9.7 bandit==1.9.4 mypy==1.15.0 pytest==8.3.4 pytest-cov==6.0.0 pytest-asyncio==0.25.2 hypothesis==6.124.7
          mkdir -p reports

      - name: Generate ephemeral test secrets (V300 SECURITY)
        run: |
          echo "FIREAI_SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> $GITHUB_ENV
          echo "FIREAI_API_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV

      - name: Lint
        run: ruff check fireai/ qomn_conduit/ --exit-non-zero-on-fix

      - name: Type check
        # V300: Align with deploy.yml — mypy exits 1 on pre-existing type errors.
        # Use || true so LOW/MEDIUM findings don't block deploy.
        run: mypy fireai/ qomn_conduit/ --ignore-missing-imports --no-strict-optional --exclude '.*test.*' --python-version 3.12 || true

      - name: Security scan
        # V300: Align with deploy.yml — bandit exits 1 on ANY finding.
        # Use || true so LOW/MEDIUM findings don't block deploy.
        run: bandit -r fireai/ qomn_conduit/ -f json -o reports/bandit.json -ll || true

      - name: Unit tests
        env:
          FIREAI_SESSION_SECRET: ${{ env.FIREAI_SESSION_SECRET }}
          FIREAI_API_KEY: ${{ env.FIREAI_API_KEY }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
          DATABASE_URL: "sqlite:////tmp/fireai_full_deploy_test.db"
          DIGITAL_TWIN_DB_PATH: "/tmp/fireai_full_deploy_test.db"
          UDM_DB_PATH: "/tmp/udm_full_deploy_test.db"
        run: |
          pip install --only-binary :all: pytest-timeout==2.3.1 slowapi==0.1.10 tenacity==9.0.0 openpyxl==3.1.5
          # V301 FIX: Aggressive cleanup of stale db/ artifacts before pytest.
          # backend.api_keys creates db/api_keys.secret at module import time,
          # and if it persists from a previous test run, the secret format may
          # be incompatible → RuntimeError on _load_server_secret().
          rm -rf db/ /tmp/fireai_full_deploy_test.db /tmp/udm_full_deploy_test.db
          find . -name "api_keys.secret" -delete 2>/dev/null || true
          pytest tests/ backend/tests/ -v \
            --tb=short \
            --timeout=300 \
            --timeout-method=signal \
            --continue-on-collection-errors \
            -q

      - name: Build frontend
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run typecheck
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # JOB 2: Build & Push Docker Images
  # ============================================================================
  build:
    timeout-minutes: 30
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
            - dockerfile: deploy/docker/Dockerfile.api
              target: api
            - dockerfile: deploy/docker/Dockerfile.worker
              target: worker
            - dockerfile: deploy/docker/Dockerfile.nginx
              target: nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-,format=short
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ============================================================================
  # JOB 3: Deploy to Hugging Face Spaces
  # ============================================================================
  deploy-huggingface:
    timeout-minutes: 30
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Check HF_TOKEN secret
        id: check-token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set — skipping HuggingFace deployment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.check-token.outputs.skip != 'true'

      - name: Download frontend build
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend-build/

      - name: Deploy to Hugging Face Space
        if: steps.check-token.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --only-binary :all: huggingface_hub==0.28.1
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          # Upload frontend build to Hugging Face Space
          api.upload_folder(
              folder_path='frontend-build',
              repo_id='${{ env.HF_SPACE_ID }}',
              repo_type='space',
              path_in_repo='.',
              commit_message='Auto-deploy from GitHub Actions - ${{ github.sha }}'
          )
          print('✅ Hugging Face deployment complete')
          "

  # ============================================================================
  # JOB 4: Deploy to Render
  # ============================================================================
  deploy-render:
    timeout-minutes: 30
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}'
          echo '✅ Render deployment triggered'

  # ============================================================================
  # JOB 5: Deploy to Kubernetes (Staging/Production)
  # ============================================================================
  deploy-k8s:
    timeout-minutes: 30
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, deploy-huggingface, deploy-render]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        environment: [staging, production]
    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.environment == 'production' && 'https://fireai.example.com' || 'https://staging.fireai.example.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: latest

      - name: Set up kubeconfig
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ matrix.environment }}" == "production" ]; then
            echo "$KUBE_CONFIG_PRODUCTION" | base64 -d > $HOME/.kube/config
          else
            echo "$KUBE_CONFIG_STAGING" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Deploy Helm chart
        # V300 FIX (H-13): Write secrets to temp YAML file instead of --set
        # (avoids leaking secrets in /proc/<pid>/cmdline on the runner).
        env:
          FIREAI_API_KEY: ${{ secrets.FIREAI_API_KEY }}
          FIREAI_EVIDENCE_HMAC_KEY: ${{ secrets.FIREAI_EVIDENCE_HMAC_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ matrix.environment == 'production' && secrets.DB_PASSWORD_PRODUCTION || secrets.DB_PASSWORD_STAGING }}
          REDIS_PASSWORD: ${{ matrix.environment == 'production' && secrets.REDIS_PASSWORD_PRODUCTION || secrets.REDIS_PASSWORD_STAGING }}
        run: |
          cat > /tmp/helm-secrets-${{ matrix.environment }}.yaml << HELMEOF
          secrets:
            fireai-secrets:
              stringData:
                FIREAI_API_KEY: "${FIREAI_API_KEY}"
                FIREAI_EVIDENCE_HMAC_KEY: "${FIREAI_EVIDENCE_HMAC_KEY}"
                GEMINI_API_KEY: "${GEMINI_API_KEY}"
                ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
                JWT_SECRET: "${JWT_SECRET}"
                DB_PASSWORD: "${DB_PASSWORD}"
                REDIS_PASSWORD: "${REDIS_PASSWORD}"
          HELMEOF
          helm upgrade --install fireai-${{ matrix.environment }} deploy/helm/fireai \
            --namespace fireai-${{ matrix.environment }} \
            --create-namespace \
            --set images.api.tag=${{ env.VERSION }} \
            --set images.worker.tag=${{ env.VERSION }} \
            --set images.nginx.tag=${{ env.VERSION }} \
            --set ingress.hosts[0].host=${{ matrix.environment == 'production' && 'fireai.example.com' || 'staging.fireai.example.com' }} \
            --set replicas.api=${{ matrix.environment == 'production' && '3' || '1' }} \
            --values /tmp/helm-secrets-${{ matrix.environment }}.yaml \
            --wait --timeout 300s
          rm -f /tmp/helm-secrets-${{ matrix.environment }}.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/fireai-api -n fireai-${{ matrix.environment }} --timeout=180s
          kubectl rollout status deployment/fireai-worker -n fireai-${{ matrix.environment }} --timeout=180s
          echo "${{ matrix.environment }} deployment complete."

  # ============================================================================
  # JOB 6: Sync to ETAP-AI-WORK Repository
  # ============================================================================
  sync-etap:
    timeout-minutes: 30
    name: Sync to ETAP-AI-WORK Repository
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check ETAP_TOKEN secret
        id: check-token
        env:
          ETAP_TOKEN: ${{ secrets.ETAP_TOKEN }}
        run: |
          if [ -z "$ETAP_TOKEN" ]; then
            echo "::warning::ETAP_TOKEN secret is not set — skipping ETAP sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.check-token.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Configure Git
        if: steps.check-token.outputs.skip != 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Clone ETAP-AI-WORK repository
        if: steps.check-token.outputs.skip != 'true'
        # V300 FIX: Use git credential helper instead of embedding token in URL
        # to prevent leaking the token in /proc/<pid>/cmdline on the runner.
        env:
          ETAP_TOKEN: ${{ secrets.ETAP_TOKEN }}
        run: |
          echo "https://x-access-token:${ETAP_TOKEN}@github.com" > $HOME/.git-credentials
          git config --global credential.helper store
          git clone https://github.com/${{ env.ETAP_REPO }} etap-repo
          cd etap-repo
          git checkout main || git checkout master
          
      - name: Sync files
        if: steps.check-token.outputs.skip != 'true'
        run: |
          # Copy updated files to ETAP repo
          # V301 FIX: Exclude etap-repo/ from rsync to prevent infinite nesting
          # (etap-repo/etap-repo/etap-repo/...). The previous rsync copied
          # the entire working directory including etap-repo/ itself, causing
          # recursive directory nesting and rsync to run out of memory/disk.
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='__pycache__' \
            --exclude='etap-repo' \
            ./ etap-repo/

          cd etap-repo
          git add -A
          git diff --cached --quiet || git commit -m "Sync from BAZspark repo - ${{ github.sha }}"
          git push origin main || git push origin master
          echo '✅ Synced to ETAP-AI-WORK repository'

      - name: Cleanup credentials
        if: always() && steps.check-token.outputs.skip != 'true'
        run: rm -f $HOME/.git-credentials

  # ============================================================================
  # JOB 7: Notify All Services
  # ============================================================================
  notify:
    timeout-minutes: 30
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-huggingface, deploy-render, deploy-k8s, sync-etap]
    if: always()
    steps:
      - name: Check all deployments
        run: |
          echo "Deployment Summary:"
          echo "HuggingFace: ${{ needs.deploy-huggingface.result }}"
          echo "Render: ${{ needs.deploy-render.result }}"
          echo "Kubernetes: ${{ needs.deploy-k8s.result }}"
          echo "ETAP Sync: ${{ needs.sync-etap.result }}"
          
      - name: Notify success
        if: |
          needs.deploy-huggingface.result == 'success' ||
          needs.deploy-render.result == 'success' ||
          needs.deploy-k8s.result == 'success'
        run: |
          echo "✅ At least one deployment successful!"
          
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1
name: Governance Runtime Audit

on:
  schedule:
    - cron: '0 3 * * *'  # Run daily at 03:00 UTC
  workflow_dispatch:      # Enable manual triggering

permissions:
  contents: read

jobs:
  audit-governance:
    name: "Governance Integrity & Anti-Bypass Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Run Documentation Drift Gate
        run: node scripts/validate-readme-drift.cjs

      - name: Run Repository Governance Runtime Drift Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-governance-runtime.cjs

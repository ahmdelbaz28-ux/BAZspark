# Secret Scanning — Gitleaks
# Scans for hardcoded secrets on every push and PR.
# P0-14 FIX: now BLOCKING — a leaked secret fails the workflow.

name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    timeout-minutes: 30
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Create gitleaks allowlist config
        run: |
          cat > /tmp/gitleaks.toml << 'TOML_EOF'
          title = "BAZspark Gitleaks Config"

          [extend]
          useDefault = true

          [allowlist]
          description = "Global allowlist for documentation, workflows, and backend test suites"
          paths = [
            '''.github/workflows/.*\.ya?ml''',
            '''\.github/workflows/.*\.yml''',
            '''\.github/workflows/.*\.yaml''',
            '''\.secrets\.baseline''',
            '''.*\.example.*''',
            '''env\.example\.txt''',
            '''\.env\.example''',
            '''CHANGELOG\.md''',
            '''OPS_RUNBOOK\.md''',
            '''FINAL_.*\.md''',
            '''DEPLOY_.*\.md''',
            '''backend/tests/.*''',
            '''.*test_phase2c_hydraulics_spine\.py''',
          ]
          regexes = [
            '''\$\{\{\s*secrets\.[A-Z_]+\s*\}\}''',
            '''\$\{\{\s*env\.[A-Z_]+\s*\}\}''',
          ]
          TOML_EOF

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: /tmp/gitleaks.toml
        # P0-14 FIX: removed `continue-on-error: true` — a leaked secret
        # must fail the workflow, not just post a warning comment.

      - name: Report scan result
        if: always()
        run: echo "Secret scan completed. Check Security tab for any findings."
# ═══════════════════════════════════════════════════════════════════════════
# SonarCloud Code Quality Analysis
# ═══════════════════════════════════════════════════════════════════════════
# Runs SonarQube Cloud scan on push to main/develop and on PRs to main.
# Requires SONAR_TOKEN repository secret (set in GitHub Settings → Secrets).
#
# Configuration is in sonar-project.properties (project key, sources,
# exclusions, coverage paths, etc.).
#
# Note: The scan reports results to https://sonarcloud.io/project/overview?id=ahmdelbaz28-ux_revit
# ═══════════════════════════════════════════════════════════════════════════

name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # Allows SonarCloud to post PR comments

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Disabling shallow clones is REQUIRED for accurate SonarCloud reporting
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pytest-timeout REQUIRED — the scan below passes --timeout=60
          pip install pytest pytest-cov pytest-timeout

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Generate ephemeral test secrets (V288 SECURITY — no hardcoded creds)
        run: echo "FIREAI_SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> $GITHUB_ENV

      - name: Run Python tests with coverage
        env:
          FIREAI_SESSION_SECRET: ${{ env.FIREAI_SESSION_SECRET }}
          DATABASE_URL: sqlite:////tmp/sonar_test.db
          DIGITAL_TWIN_DB_PATH: /tmp/sonar_test.db
          UDM_DB_PATH: /tmp/udm_sonar_test.db
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
        run: |
          pytest tests/ backend/tests/ \
            --tb=short \
            --cov=backend \
            --cov=fireai \
            --cov=qomn_fire \
            --cov=qomn_conduit \
            --cov=parsers \
            --cov=adapters \
            --cov=core \
            --cov-report=xml:coverage.xml \
            # timeout_func_only=true applies the 60s ceiling to the TEST BODY
            # only, NOT to collection/setup. Otherwise the 60s budget is spent
            # collecting the ~8k-test suite (28s+) plus per-test fixtures, the
            # session-wide timeout fires before tests run, and coverage.xml ends
            # up empty -> SonarCloud reports 0% new-code coverage (gate fail).
            -o timeout_func_only=true \
            --timeout=60 -q \
            -p no:cacheprovider \
            || echo "::warning::Some tests failed (non-blocking for SonarCloud scan)"

      - name: Run frontend tests with coverage
        run: |
          npm run test -- --coverage 2>/dev/null || true
        working-directory: frontend

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ═══════════════════════════════════════════════════════════════════════════
# SonarCloud Code Quality Analysis
# ═══════════════════════════════════════════════════════════════════════════
# Runs SonarQube Cloud scan on push to main/develop and on PRs to main.
# Requires SONAR_TOKEN repository secret (set in GitHub Settings → Secrets).
#
# Configuration is in sonar-project.properties (project key, sources,
# exclusions, coverage paths, etc.).
#
# Note: The scan reports results to https://sonarcloud.io/project/overview?id=ahmdelbaz28-ux_revit
# ═══════════════════════════════════════════════════════════════════════════

name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # Allows SonarCloud to post PR comments

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Disabling shallow clones is REQUIRED for accurate SonarCloud reporting
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Pin the same test toolchain as every other CI gate (ci.yml Gate 2,
          # ci-build-gate.yml Backend Tests): pyproject.toml sets pytest-asyncio
          # ini options (asyncio_default_fixture_loop_scope); without the plugin,
          # pytest aborts at startup ("Unknown config option", exit 4) BEFORE any
          # test runs, coverage.xml is never written, and the SonarCloud quality
          # gate fails on missing coverage.
          pip install --only-binary :all: pytest==8.3.4 pytest-cov==6.0.0 pytest-asyncio==0.25.2 pytest-timeout==2.3.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Generate ephemeral test secrets (V288 SECURITY — no hardcoded creds)
        run: echo "FIREAI_SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> $GITHUB_ENV

      - name: Run Python tests with coverage
        env:
          FIREAI_SESSION_SECRET: ${{ env.FIREAI_SESSION_SECRET }}
          DATABASE_URL: sqlite:////tmp/sonar_test.db
          DIGITAL_TWIN_DB_PATH: /tmp/sonar_test.db
          UDM_DB_PATH: /tmp/udm_sonar_test.db
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
        # NOTE: comments must NOT follow a line-continuation backslash — bash
        # joins the lines, so everything after "#" would become a comment and
        # silently drop the remaining options (incl. the `|| echo` fallback).
        # Root cause of the SonarCloud gate failure: without pytest-asyncio the
        # ini option asyncio_default_fixture_loop_scope is unknown -> pytest
        # exits 4 before running any test -> coverage.xml is never produced.
        # --timeout=300 is a per-test ceiling (same as ci-build-gate.yml);
        # --continue-on-collection-errors keeps a broken module from producing
        # zero coverage, matching Gate 2's proven invocation.
        run: |
          pytest tests/ backend/tests/ \
            --tb=short \
            --cov=. \
            --cov-config=pyproject.toml \
            --cov-report=xml:coverage.xml \
            --timeout=300 \
            --continue-on-collection-errors \
            -q \
            -p no:cacheprovider \
            || echo "::warning::Some tests failed (non-blocking for SonarCloud scan)"


      - name: Run frontend tests with coverage
        run: |
          npm run test -- --coverage 2>/dev/null || true
        working-directory: frontend

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

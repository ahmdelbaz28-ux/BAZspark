# ═══════════════════════════════════════════════════════════════════════════
# SonarCloud Code Quality Analysis
# ═══════════════════════════════════════════════════════════════════════════
# Runs SonarQube Cloud scan on push to main/develop and on PRs to main.
# Requires SONAR_TOKEN repository secret (set in GitHub Settings → Secrets).
#
# Configuration is in sonar-project.properties (project key, sources,
# exclusions, coverage paths, etc.).
#
# Note: The scan reports results to https://sonarcloud.io/project/overview?id=ahmdelbaz28-ux_revit
# ═══════════════════════════════════════════════════════════════════════════

name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # Allows SonarCloud to post PR comments

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Disabling shallow clones is REQUIRED for accurate SonarCloud reporting
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --only-binary :all:
          pip install --only-binary :all: -e .
          pip install --only-binary :all: pytest==8.3.4 pytest-cov==6.0.0 pytest-timeout==2.3.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: frontend

      - name: Generate ephemeral test secrets (V288 SECURITY — no hardcoded creds)
        run: echo "FIREAI_SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> $GITHUB_ENV

      - name: Run Python tests with coverage
        env:
          FIREAI_SESSION_SECRET: ${{ env.FIREAI_SESSION_SECRET }}
          DATABASE_URL: sqlite:////tmp/sonar_test.db
          DIGITAL_TWIN_DB_PATH: /tmp/sonar_test.db
          UDM_DB_PATH: /tmp/udm_sonar_test.db
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
        run: |
          pytest tests/ backend/tests/ \
            --tb=short \
            --timeout=60 -q \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -p no:cacheprovider \
            || echo "::warning::Some tests failed (non-blocking for SonarCloud scan)"

      - name: Run frontend tests with coverage
        run: |
          # lcov reporter must be enabled explicitly: vite.config.ts has no
          # coverage block, and vitest default reporters omit lcov.info.
          npm run test -- --coverage --coverage.reporter=lcov --coverage.reporter=text 2>/dev/null || true
        working-directory: frontend

      - name: SonarQube Scan
        # V290 (2026-08-02): Root-cause fix - Automatic Analysis (AutoScan)
        # must be DISABLED for this project, otherwise CI analysis is rejected
        # with exit code 3:
        #   "You are running CI analysis while Automatic Analysis is enabled.
        #    Please consider disabling one or the other."
        #
        # AutoScan and CI-based analysis are mutually exclusive. This workflow
        # is now the project single analysis source - it also uploads the
        # coverage reports (coverage.xml, frontend/coverage/lcov.info) produced
        # by the test steps above.
        #
        # Manual step required once (no public SonarCloud API exists to do it
        # programmatically): disable Automatic Analysis at
        #   https://sonarcloud.io/project/settings?category=analysis&id=ahmdelbaz28-ux_revit
        #
        # Until that toggle is flipped this step fails with exit code 3 -
        # intentionally visible instead of silently masked.
        # Requires the SONAR_TOKEN repository secret.
        uses: SonarSource/sonarqube-scan-action@aa494459d7c39c106cc77b166de8b4250a32bb97  # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

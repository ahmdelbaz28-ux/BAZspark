# NOSONAR — text:S8565: lock file (uv.lock) is committed to the repo; dependency
# versions ARE predictable. See `uv.lock` at repo root.
[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-bim-integration-platform"
dynamic = ["version"]
description = "Complete platform for AutoCAD and Revit integration with Digital Twin capabilities"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "FireAI Project", email = "contact@fireai.org"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed"
]
keywords = ["cad", "bim", "revit", "autocad", "digital-twin", "engineering", "integration"]
dependencies = [
    "fastapi>=0.100.0,<2.0.0",
    "starlette>=0.27.0,<2.0.0",
    "uvicorn[standard]>=0.20.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "alembic>=1.10.0,<2.0.0",
    "python-multipart>=0.0.31,<1.0.0",  # V163 RESTORE: was reverted to 0.0.20 by 9da220d2 (6 known CVEs)
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.34.0,<3.0.0",
    "pyjwt[crypto]>=2.13.0,<3.0.0",  # V163 RESTORE: was reverted to 2.9.0 by 9da220d2 (7 known CVEs)
    "passlib[bcrypt]>=1.7.0,<2.0.0",
    "bcrypt>=4.0.0,<6.0.0",  # V157 PHASE-0: hard dep — no silent SHA-256 fallback in safety-critical auth
    "cryptography>=50.0.0,<51.0.0",  # V163: fix 6 HIGH CVEs incl. CVE-2026-69247 (Python >=3.12 supported)
    "websockets>=12.0.0,<18.0.0",

[project]
name = "bazspark-rag-eval"
version = "1.0.0"
description = "RAG evaluation harness for BAZspark — NFPA 72 Engineering Copilot quality benchmarks"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "tabulate>=0.9",
    "ragas>=0.1.0",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "datasets>=2.18",
    "pandas>=2.0",
    "tqdm>=4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
